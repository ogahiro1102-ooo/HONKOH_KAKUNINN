<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>社内検査 管理画面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 16px;
    }
    h1 {
      margin-bottom: 8px;
    }
    .controls {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    label {
      margin-right: 8px;
    }
    input, button {
      padding: 4px 6px;
      margin-right: 4px;
    }
    button {
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
    }
    th {
      background: #eee;
    }
  </style>
</head>

<body>
<h1>社内検査 管理画面</h1>

<div class="controls">
  <label>
    検査日：
    <input type="date" id="from">
    ～
    <input type="date" id="to">
  </label>

  <button id="todayBtn">今日</button>
  <button id="tomorrowBtn">明日</button>
  <button id="loadBtn">表示</button>
</div>

<table>
  <thead>
    <tr>
      <th>検査日</th>
      <th>時間</th>
      <th>業者</th>
      <th>場所</th>
      <th>船番</th>
      <th>ブロック</th>
      <th>区画</th>
      <th>備考</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
  /* ===== 設定 ===== */
  const GAS_URL = https://gas-syakenn.onrender.com
  // ↑ 申請側と同じURL

  const fromInput = document.getElementById("from");
  const toInput = document.getElementById("to");
  const list = document.getElementById("list");

  /* 初期表示：翌日 */
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const t = tomorrow.toISOString().slice(0, 10);
  fromInput.value = t;
  toInput.value = t;

  document.getElementById("todayBtn").onclick = () => {
    const d = new Date().toISOString().slice(0, 10);
    fromInput.value = d;
    toInput.value = d;
  };

  document.getElementById("tomorrowBtn").onclick = () => {
    fromInput.value = t;
    toInput.value = t;
  };

  document.getElementById("loadBtn").onclick = loadData;

  async function loadData() {
    list.innerHTML = "";

    const url =
      GAS_URL +
      "?from=" + fromInput.value +
      "&to=" + toInput.value;

    const res = await fetch(url);
    const data = await res.json();

    data.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${row.hour}</td>
        <td>${row.vendor}</td>
        <td>${row.place}</td>
        <td>${row.ship}</td>
        <td>${row.block}</td>
        <td>${row.area}</td>
        <td>${row.note || ""}</td>
      `;
      list.appendChild(tr);
    });
  }
</script>
</body>
</html>
