<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検査スケジュール管理システム</title>
  
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --primary-color: #007bff;
      --success-color: #28a745;
      --bg-color: #f8f9fa;
    }
    body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; color: #444; }
    
    .btn-excel {
      background-color: var(--success-color);
      color: white; border: none; padding: 12px 24px; border-radius: 6px;
      cursor: pointer; font-weight: bold; transition: opacity 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-excel:hover { opacity: 0.8; }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th { background-color: var(--primary-color); color: white; text-align: left; padding: 12px; position: sticky; top: 0; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    tr:hover { background-color: #f1f7ff; }

    .loading { text-align: center; padding: 50px; font-size: 18px; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📅 検査スケジュール一覧</h1>
    <button class="btn-excel" onclick="downloadExcel()">
      <span>📊</span> Excelをダウンロード
    </button>
  </div>

  <div class="table-wrapper">
    <div id="loader" class="loading">データを取得中...</div>
    <table id="data-table" style="display: none;">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
  // 1. 【ここを書き換え】作成したAPI専用GASのURLを貼り付けてください
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxDxTptZiGLJaGjD9XyBf3-hJgEfECI5EKCtQLh-NEZA9vk085Y-mkeNd0RlRUnMxsCcg/exec";

  let cachedData = [];

  // ページ読み込み時に実行
  window.onload = fetchData;

  async function fetchData() {
    try {
      const response = await fetch(GAS_API_URL);
      const data = await response.json();
      
      if (data.error) throw new Error(data.error);
      
      cachedData = data;
      renderTable(data);
    } catch (error) {
      document.getElementById('loader').innerHTML = 
        `<span style="color:red">エラーが発生しました: ${error.message}</span>`;
    }
  }

  function renderTable(data) {
    const head = document.getElementById('table-head');
    const body = document.getElementById('table-body');
    const loader = document.getElementById('loader');
    const table = document.getElementById('data-table');

    // ヘッダー作成
    const headers = data[0];
    head.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

    // データ行作成
    body.innerHTML = data.slice(1).map(row => 
      `<tr>${row.map(cell => `<td>${cell || ''}</td>`).join('')}</tr>`
    ).join('');

    loader.style.display = 'none';
    table.style.display = 'table';
  }

  // Excelダウンロード処理
  function downloadExcel() {
    if (cachedData.length === 0) {
      alert("データの読み込みが完了していません");
      return;
    }
    
    // データの変換 (Array of Arrays -> Sheet)
    const worksheet = XLSX.utils.aoa_to_sheet(cachedData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Schedule");

    // 今日の日付を取得してファイル名にする
    const today = new Date().toISOString().split('T')[0];
    XLSX.writeFile(workbook, `検査スケジュール_${today}.xlsx`);
  }
</script>

</body>
</html>
