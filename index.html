<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>検査申請 管理</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:system-ui; padding:12px; background:#f4f6f8}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    input,button,select{padding:8px;font-size:14px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #ccc;padding:6px;text-align:center;font-size:13px}
    th{background:#eee}
    tr.dup{background:#ffd6d6}
  </style>
</head>
<body>
  <h2 style="text-align:center">検査申請 管理画面</h2>

  <div class="controls">
    <input type="date" id="start">
    <span>〜</span>
    <input type="date" id="end">
    <button id="btnToday">今日</button>
    <button id="btnTomorrow">明日</button>
    <button id="btnLoad">表示</button>
    <button id="btnExcel">Excel出力</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>業者名</th><th>船番</th><th>ブロック</th><th>区画</th>
        <th>検査日</th><th>時間</th><th>場所</th><th>備考</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwd2Zh7ng92GXoFMb9PT9ucUFyLAoykeEfC4pe7Hn_9k9zjV0m87GtmVkNXjXLCW9_zQQ/exec"; // ← 新しい /exec URL

  document.getElementById('btnToday').addEventListener('click', () => {
    const d = new Date(); const s = d.toISOString().slice(0,10);
    start.value = s; end.value = s;
  });
  document.getElementById('btnTomorrow').addEventListener('click', () => {
    const d = new Date(); d.setDate(d.getDate()+1); const s = d.toISOString().slice(0,10);
    start.value = s; end.value = s;
  });

  document.getElementById('btnLoad').addEventListener('click', loadData);
  document.getElementById('btnExcel').addEventListener('click', exportExcel);

  async function loadData(){
    const s = start.value || "";
    const e = end.value || "";
    try {
      const res = await fetch(`${GAS_URL}?start=${s}&end=${e}`);
      const data = await res.json(); // expect array of arrays
      renderTable(data);
    } catch (err) {
      alert('データ取得に失敗しました');
      console.error(err);
    }
  }

  function renderTable(data){
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    // 重複判定：検査日_時間_場所
    const map = {};
    data.forEach(r => {
      const key = `${r[5]}_${r[6]}_${r[7]}`;
      map[key] = (map[key]||0)+1;
    });

    data.forEach(r => {
      const key = `${r[5]}_${r[6]}_${r[7]}`;
      const tr = document.createElement('tr');
      if (map[key] > 1) tr.classList.add('dup');
      tr.innerHTML = `
        <td>${escapeHtml(r[1])}</td>
        <td>${escapeHtml(r[2])}</td>
        <td>${escapeHtml(r[3])}</td>
        <td>${escapeHtml(r[4])}</td>
        <td>${escapeHtml(r[5])}</td>
        <td>${escapeHtml(r[6])}</td>
        <td>${escapeHtml(r[7])}</td>
        <td>${escapeHtml(r[8])}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function exportExcel(){
    const s = start.value || "";
    const e = end.value || "";
    try {
      const res = await fetch(`${GAS_URL}?start=${s}&end=${e}`);
      const data = await res.json();
      const rows = [["業者名","船番","ブロック","区画","検査日","時間","場所","備考"]];
      data.forEach(r => rows.push([r[1],r[2],r[3],r[4],r[5],r[6],r[7],r[8]]));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, "社内検査予定");
      XLSX.writeFile(wb, "社内検査予定.xlsx");
    } catch (err) {
      alert('Excel出力に失敗しました');
      console.error(err);
    }
  }
</script>
</body>
</html>
